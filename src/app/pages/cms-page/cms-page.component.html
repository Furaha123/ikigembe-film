@if (missing() && slug() === 'terms') {
  <!-- Built-in terms text: only used when the CMS page is missing or unreachable -->
  <app-terms />
} @else {
  <div class="cms-page">
    <div class="cms-container">
      <div aria-live="polite">
        @if (loading() && !page()) {
          <p class="cms-muted">{{ 'marketplace.common.loading' | translate }}</p>
        }
      </div>

      @if (page(); as p) {
        <app-cms-page-body [title]="p.title" [body]="p.body" [updatedAt]="p.updated_at" />
      } @else if (missing()) {
        <h1 class="cms-missing-title">{{ 'cms.notFoundTitle' | translate }}</h1>
        <p class="cms-muted">{{ 'cms.notFoundText' | translate }}</p>
      }

      <nav class="cms-back" [attr.aria-label]="'cms.navLabel' | translate">
        <a routerLink="/" class="back-btn">← {{ 'cms.back' | translate }}</a>
      </nav>
    </div>
  </div>
}
