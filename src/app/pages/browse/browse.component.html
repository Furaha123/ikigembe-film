<app-header [userImg]="userProfileImg" />

@if (isLoading) {
  <div class="state-screen">
    <div class="loader-ring"></div>
    <p>{{ 'browse.loading' | translate }}</p>
  </div>
} @else if (isEmpty) {
  <div class="state-screen">
    <div class="empty-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3.375 19.5h17.25m-17.25 0a1.125 1.125 0 01-1.125-1.125M3.375 19.5h1.5C5.496 19.5 6 18.996 6 18.375m-3.75.125A1.125 1.125 0 012.25 18.375V6.75m0 11.625v-1.5m0-10.125A1.125 1.125 0 013.375 5.25h17.25A1.125 1.125 0 0121.75 6.375v10.5A1.125 1.125 0 0120.625 18H19.5"/>
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75l2.25 2.25 4.5-4.5"/>
      </svg>
    </div>
    <h2>{{ 'browse.emptyTitle' | translate }}</h2>
    <p>{{ 'browse.emptyLine1' | translate }}<br/>{{ 'browse.emptyLine2' | translate }}</p>
    <div class="empty-badge">{{ 'browse.comingSoon' | translate }}</div>
  </div>
} @else {
  <app-banner [bannerTitle]="bannerTitle" [bannerOverview]="bannerOverview" [trailerUrl]="bannerTrailerUrl" [bannerBackdropUrl]="bannerBackdropUrl" [movieId]="bannerId" />

  <app-ad-slot placement="home_hero" />
  <app-movie-carousel [title]="'browse.nowPlaying' | translate" [videoContents]="nowPlayingMovies" />
  <app-ad-slot placement="home_banner" />
  <app-movie-carousel [title]="'browse.popular' | translate" [videoContents]="popularMovies" />
  <app-ad-slot placement="browse_inline" />
  <app-movie-carousel [title]="'browse.upcoming' | translate" [videoContents]="upcomingMovies" />
}

<app-footer />
