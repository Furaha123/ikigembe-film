<div class="carousel-section">
  <p class="section-title">{{ title() }}</p>
  <div #swiperContainer class="swiper-container">
    <div class="swiper-wrapper">
      @for (movie of videoContents(); track movie.id) {
        <div
          (mouseenter)="setHoverMovie(movie)"
          (mouseleave)="clearHoverMovie()"
          class="swiper-slide"
        >
          <div class="movie-card">
            <img [src]="movie.thumbnail_url" [alt]="movie.title" loading="lazy" />
            <div class="quality-badge">HD</div>
            <button class="play-overlay" (click)="goToMovie(movie)" [attr.aria-label]="'carousel.playMovie' | translate: { title: movie.title }">
              <span class="play-btn">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                  <path d="M8 5v14l11-7z"/>
                </svg>
              </span>
            </button>
            <div class="movie-title-overlay">{{ movie.title }}</div>
          </div>
          <div class="movie-info">
            <h3 class="movie-name">{{ movie.title }}</h3>
            <div class="movie-meta">
              @if (movie.release_date) {
                <span class="year">{{ movie.release_date.substring(0, 4) }}</span>
                <span class="separator">•</span>
              }
              <span class="type">{{ 'carousel.movie' | translate }}</span>
            </div>
          </div>
        </div>
      }
    </div>
    <div class="swiper-button-prev" role="button" [attr.aria-label]="'carousel.previous' | translate"></div>
    <div class="swiper-button-next" role="button" [attr.aria-label]="'carousel.next' | translate"></div>
  </div>
</div>
